services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: delta_db
      POSTGRES_USER: delta_user
      POSTGRES_PASSWORD: delta_local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - delta_postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delta_user -d delta_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: erickjllo/delta-backend:latest
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://delta_user:delta_local_dev_password@db:5432/delta_db
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en el archivo .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"

  frontend:
    image: erickjllo/delta-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  delta_postgres_data: