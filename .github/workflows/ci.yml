name: CI - Delta

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend - Tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio y submodulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Delta-Backend/package-lock.json

      - name: Instalar dependencias
        working-directory: Delta-Backend
        run: npm ci

      - name: Ejecutar pruebas
        working-directory: Delta-Backend
        run: npm test

  frontend-checks:
    name: Frontend - Lint, Build y E2E
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio y submodulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Delta-Frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: Delta-Frontend
        run: npm ci

      - name: Verificar lint
        working-directory: Delta-Frontend
        run: npm run lint

      - name: Compilar frontend
        working-directory: Delta-Frontend
        run: npm run build

      - name: Instalar navegador de Playwright
        working-directory: Delta-Frontend
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E
        working-directory: Delta-Frontend
        run: npm run test:e2e

  docker-publish:
    name: Publicar imagenes en DockerHub
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Descargar repositorio y submodulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar backend
        uses: docker/build-push-action@v6
        with:
          context: ./Delta-Backend
          file: ./Delta-Backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/delta-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/delta-backend:sha-${{ github.sha }}

      - name: Construir y publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Delta-Frontend
          file: ./Delta-Frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/delta-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/delta-frontend:sha-${{ github.sha }}
